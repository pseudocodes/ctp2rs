[package]
name = "localctp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "query"
path = "src/bin/query.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[dependencies]
ctp2rs = { path = "../../ctp-dyn", default-features = false }

log = "0.4.22"
dotenv = "0.15.0"
env_logger = "0.11.5"


rand = "0.9"
chrono = "0.4"

tokio = { version = "1.43.1", features = ["full"] }
[features]
default = ["ctp_v6_7_2"]
ctp_v6_7_2 = ["ctp2rs/v1alpha1", "ctp2rs/openctp", "ctp2rs/ctp_v6_7_2"]
